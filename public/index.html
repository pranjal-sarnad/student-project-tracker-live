
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <button
                id="theme-toggle"
                type="button"
                aria-label="Switch to dark mode"
                aria-pressed="false"
                title="Switch theme"
            >☾</button>

            <p>Electronics Workshop</p>
            <h1>Student Project Tracker</h1>
            <p class="student-info">Pranjal Sarnad</p>
            <p class="student-info">Class: 3 "C"</p>
            <p>Track our electronics project ideas.</p>
        </header>

        <section aria-labelledby="form-title">
            <h2 id="form-title">Add a project</h2>

            <form id="project-form">
                <div>
                    <label for="name">Project name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        maxlength="80"
                    >
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Planned">Planned</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <button id="save-button" type="submit">
                    Add project
                </button>

                <button id="cancel-button" type="button" hidden>
                    Cancel
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section aria-labelledby="list-title">
            <h2 id="list-title">My projects</h2>

            <p id="empty-state">
                No projects yet. Add your first idea.
            </p>

            <ul id="project-list"></ul>
        </section>
    </main>
</body>
</html>
